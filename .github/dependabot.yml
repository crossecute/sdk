# Actions are pinned by commit and npm dependencies exactly, so nothing moves unless one of these
# PRs is merged. The cooldown skips versions published in the last week; security updates ignore it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The OpenZeppelin pins must equal the peer pins of @crossecute/protocol, so they move with it.
    ignore:
      - dependency-name: "@openzeppelin/*"
