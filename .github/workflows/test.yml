name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit: a moved tag would change what runs against this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: npm ci --ignore-scripts

      - run: forge fmt --check

      # The TypeScript tests read the files forge test writes under out/ and vectors/.
      - run: forge test

      # Fails if forge test rewrote a committed vector, which means the two languages drifted.
      - run: git diff --exit-code vectors/

      - run: npx vitest run

      - run: npm run typecheck

      - run: npm run build

      - run: scripts/check-forge-attest.sh

  # The pin is a commit on protocol's #135 branch, not a merge commit. This fails if the vendored
  # snapshot, generated ABIs, authority vectors or OFT pins differ from what that commit produces, or the OFT
  # vectors differ from what its contracts compute.
  protocol-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: pin
        run: echo "revision=$(jq -r .revision contracts/vendor/protocol135/manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crossecute/protocol
          ref: ${{ steps.pin.outputs.revision }}
          path: protocol
          # Not recursive: OpenZeppelin's nested submodules serve only its own test suite.
          submodules: true
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.1

      - run: forge build src
        working-directory: protocol/contracts/evm

      - run: forge build src
        working-directory: protocol/contracts/safe-guard

      - run: python3 scripts/sync-protocol135.py --check protocol

      # Runs protocol's LzOftMessage, LzMessage and LzOftConduitFactory over vectors/lzoft.json; protocol has no
      # literal OFT vectors to copy. Adds and removes a script in the disposable checkout. `forge script` compiles
      # only what the script imports, so the submodules above suffice: about 1 s after the src builds, 13 s alone.
      - run: python3 scripts/check-lzoft-vectors.py protocol
