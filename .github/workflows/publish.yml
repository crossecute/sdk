name: publish

# Stages @crossecute/sdk from a tag `v<version>` through npm trusted publishing: no npm token
# exists, and npm attaches provenance tying the tarball to this run. The `npm` environment holds
# the job until a reviewer approves it, and the staged version stays hidden until a maintainer
# approves it on npmjs.com with 2FA, so this run alone cannot release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - name: The tag names the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$GITHUB_REF_NAME" == "v$version" ]] \
            || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      # Install scripts run on every consumer's machine, and a file: or git dependency does not
      # resolve for them, so the package may have neither.
      - name: The package installs from the registry alone
        run: |
          node -e 'const p = require("./package.json");
            const hooks = ["preinstall", "install", "postinstall", "prepare"].filter((k) => k in (p.scripts ?? {}));
            if (hooks.length) { console.error("install scripts: " + hooks); process.exit(1); }
            const deps = { ...p.dependencies, ...p.peerDependencies };
            const local = Object.entries(deps).filter(([, v]) => !/^[\d^~<>=. |x*-]+$/.test(v));
            if (local.length) { console.error("non-registry dependencies: " + JSON.stringify(local)); process.exit(1); }'

      - run: npm ci --ignore-scripts

      - run: forge test

      - run: npx vitest run

      - run: npm run typecheck

      # prepack builds dist/ from this checkout.
      - run: npm stage publish . --access public
